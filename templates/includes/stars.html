{% load sporty %}<span class="rating{% if large %} rating--lg{% endif %}">
  <span class="stars" role="img" aria-label="امتیاز {{ value|fa_decimal }} از ۵">
    <span class="stars__row" aria-hidden="true">{% for _ in "12345" %}<svg viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg>{% endfor %}</span>
    <span class="stars__row stars__fill" style="width: {{ value|rating_percent }}%" aria-hidden="true">{% for _ in "12345" %}<svg viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg>{% endfor %}</span>
  </span>
  <span class="rating__value">{{ value|fa_decimal }}</span>
  {% if count %}<span class="rating__count">({{ count|fa_digits }})</span>{% endif %}
</span>
