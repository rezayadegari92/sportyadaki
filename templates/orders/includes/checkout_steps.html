<ol class="steps" aria-label="مراحل خرید">
  <li class="steps__item{% if step >= 1 %} is-done{% endif %}"{% if step == 1 %} aria-current="step"{% endif %}><span class="steps__dot">۱</span>سبد خرید</li>
  <li class="steps__item{% if step >= 2 %} is-done{% endif %}"{% if step == 2 %} aria-current="step"{% endif %}><span class="steps__dot">۲</span>اطلاعات ارسال</li>
  <li class="steps__item{% if step >= 3 %} is-done{% endif %}"{% if step == 3 %} aria-current="step"{% endif %}><span class="steps__dot">۳</span>پرداخت</li>
</ol>
